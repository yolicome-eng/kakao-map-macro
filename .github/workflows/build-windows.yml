name: Build Windows EXE # address-search-fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name KakaoMapFavoriteMacro kakao_favorite_macro.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KakaoMapFavoriteMacro-Windows
          path: dist/KakaoMapFavoriteMacro.exe
          if-no-files-found: error
