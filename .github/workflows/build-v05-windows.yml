name: Build Kakao v0.5 Windows EXE
on:
  push:
    branches: [main]
    paths:
      - kakao_favorite_macro_v05.py
      - .github/workflows/build-v05-windows.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0
      - name: Syntax check
        run: python -m py_compile kakao_favorite_macro_v05.py
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name KakaoFavorite_v05_TEST kakao_favorite_macro_v05.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KakaoFavorite-v05-Windows-EXE
          path: dist/KakaoFavorite_v05_TEST.exe
          if-no-files-found: error
